[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
lazy_static = "1.5.0"
log = "0.4"
rust_decimal = { version = "1.38.0", features = ["db-postgres", "db-tokio-postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.14.1"
sqlx = { version = "0.8.6", features = ["postgres", "derive", "chrono", "rust_decimal", "macros", "runtime-tokio"] }
strum = { version = "0.27.2", features = ["derive"] }
tauri = { version = "2.8.5", features = ["config-toml"] }
tauri-plugin-devtools = "2.0.0"
tauri-plugin-log = "2"
tokio = { version = "1.47.1", features = ["full"] }

"$schema" = "https://schema.tauri.app/config/2"
productName = "dailies"
version = "0.1.0"
identifier = "com.dailies.dev"

[build]
frontendDist = "../out"
devUrl = "http://localhost:3002"
beforeDevCommand = "npm run dev"
beforeBuildCommand = "npm run build"

[app]
withGlobalTauri = false

[[app.windows]]
title = "dailies"
width = 411
height = 923
resizable = false
fullscreen = false
decorations = false

[bundle]
active = true
targets = "all"
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
